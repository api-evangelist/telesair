compliance_note: >-
  No Compliance pointer is emitted. Telesair publishes no trust center and names no information
  security or privacy certification (SOC 2, ISO 27001, HIPAA, PCI, FedRAMP); trust.telesair.com,
  /trust, /security and /compliance were all probed and none exists. The FDA and CE clearances above
  are product regulatory clearances and are recorded here as facts, not as an API compliance program.
