aid: telesair
name: Telesair
description: 'Telesair, Inc. is a Southern California MedTech company, founded in 2020 and headquartered
  in Irvine, California, that builds respiratory care hardware for patients with respiratory insufficiency.
  Its flagship product is Bonhawa, a purpose-built High Flow Oxygen Therapy (HFOT) respiratory humidifier
  that delivers warmed and humidified respiratory gases to spontaneously breathing pediatric and adult
  patients (10 kg and up) across a 2-80 L/min flow range, with separate pediatric and adult modes, a streamlined
  disinfection process and a touchscreen interface. Bonhawa holds both FDA 510(k) clearance (October 2023)
  and the CE Mark under the European Medical Device Regulation (August 2023), and is distributed to US
  hospitals under an exclusive agreement with Tri-anim Health Services. Telesair also supplies AVEA disposable
  expiratory filters. Telesair is a medical device manufacturer rather than a software vendor: it publishes
  no developer portal, no API reference and no machine-readable API contract. Its only machine-readable
  agent surface is the Wix platform''s Site Visitor Assistant MCP endpoint and an llms.txt served from
  its own marketing host.'
