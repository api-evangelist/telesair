tools:
- name: GetBusinessDetails
  parameters: []
  description: Returns business and site details for Telesair - timezone, email, phone, fax, address.
- name: SearchInSite
  parameters:
  - searchTerm
  required:
  - searchTerm
  description: Full-text search across the public Telesair site content.
- name: SearchSiteApiDocs
  parameters:
  - searchTerm
  required:
  - searchTerm
  description: Searches the API documentation for the Wix business solutions installed on this site and
    returns how to drive them. This describes WIX solution APIs available to the site, not a Telesair
    API.
- name: GenerateVisitorToken
  parameters: []
  description: Mints an anonymous visitor session and access token. Required before CallWixSiteAPI or
    ExecuteWixAPI - this is the auth step, and it is self-service with no credential.
- name: CallWixSiteAPI
  parameters:
  - visitorToken
  - url
  - method
  - body
  required:
  - visitorToken
  - url
  - method
  description: Calls a Wix API method on the visitor's behalf (query site data, book, start a purchase).
    Write-capable.
- name: ExecuteWixAPI
  parameters:
  - code
  - reason
  - hasMutations
  - sourceDocUrls
  - visitorToken
  required:
  - code
  - reason
  - hasMutations
  - sourceDocUrls
  - visitorToken
  description: Runs JavaScript against the Wix REST API in a sandbox on the visitor's behalf. Carries
    an explicit hasMutations flag the caller must set. Write-capable.
- name: BrowseWixRESTDocsMenu
  parameters:
  - menuUrl
  - reason
  required:
  - reason
  description: Navigates the Wix REST API documentation menu hierarchy to discover APIs.
- name: ReadFullDocsArticle
  parameters:
  - articleUrl
  required:
  - articleUrl
  description: Fetches a full article from the Wix developer documentation portal.
- name: ReadFullDocsMethodSchema
  parameters:
  - articleUrl
  - reason
  required:
  - articleUrl
  - reason
  description: Fetches the full request/response schema for a Wix API method.
notes:
- The 9 tools carry real inputSchema definitions, retrieved live and unauthenticated; the verbatim tools/list
  response is saved to mcp/telesair-mcp-tools-list.json.
- None of the tools expose Bonhawa device telemetry, order status, clinical data or any other Telesair
  product surface. An agent can learn about the company and search the marketing site; it cannot integrate
  with a Telesair product.
- 'No tool crosswalk is emitted: a crosswalk binds MCP tools to backing OpenAPI operationIds and Telesair
  publishes no OpenAPI, so there is nothing to bind against.'
