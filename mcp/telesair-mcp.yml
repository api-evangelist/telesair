name: Telesair Site Visitor Assistant (Wix Site MCP)
description: 'Telesair serves a live, unauthenticated remote MCP endpoint from its own marketing host
  at https://www.telesair.com/_api/mcp. It is the Wix platform''s "Site Visitor Assistant" server, provisioned
  by Wix for sites it hosts, and advertised by Telesair''s own llms.txt under an "AI Agent Access" heading.
  It is PLATFORM-AUTHORED, not authored by Telesair: the tool set is the generic Wix site-visitor tool
  set (business details, site search, Wix REST docs browsing, and a sandboxed call/execute pair against
  the Wix API on a visitor''s behalf), not an interface to any Telesair product, device or respiratory-care
  data. Telesair publishes no first-party API and no OpenAPI, so this is the only machine-readable agent
  surface it exposes.'
